name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Protocol / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        # PEP 735 dependency groups, declared in pyproject.toml.
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install --group test
      - name: Run protocol tests
        # The Home Assistant tests are skipped automatically: their dependency
        # group is not installed here.
        run: python -m pytest

  integration:
    name: Home Assistant layer
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # pytest-homeassistant-custom-component pins lru-dict 1.3.0, which
          # has no wheel for 3.13 and does not build there.
          python-version: "3.12"
      - name: Install integration test dependencies
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install --group integration
      - name: Run the full suite
        run: python -m pytest
